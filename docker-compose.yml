name: datalens

services:
  api:
    build: ./api
    env_file: .env
    environment:
      HF_HOME: /hf-cache
    volumes:
      - hfcache:/hf-cache
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s   # alembic upgrade head runs before uvicorn starts

  worker:
    build: ./api
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      HF_HOME: /hf-cache
    volumes:
      - hfcache:/hf-cache
    depends_on:
      api:
        condition: service_healthy   # the API container runs migrations; don't race them
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port 5434 (not 5432/5433): a local Postgres often already owns 5432, so
      # host tools would silently hit the wrong server. Containers use db:5432.
      # From the host: postgresql+psycopg://datalens:<password>@localhost:5434/datalens
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    # SeaweedFS: S3-compatible object storage (the minio/minio image is no longer published on Docker Hub).
    image: chrislusf/seaweedfs
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "8333:8333"   # S3 API
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  s3data:
  hfcache:
