[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/home/user/data/run/supervisord.pid

[program:postgres]
command=postgres -D /home/user/data/pg -k /tmp -h 127.0.0.1 -p 5432
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --dir /home/user/data/redis --save "" --appendonly no
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:s3]
command=weed server -dir=/home/user/data/seaweed -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3 -s3.port=8333 -master.volumeSizeLimitMB=256 -volume.max=8
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=/bin/sh -c "until pg_isready -h 127.0.0.1 -q; do sleep 1; done; createdb -h 127.0.0.1 -U datalens datalens 2>/dev/null || true; alembic upgrade head && exec uvicorn serve:app --host 0.0.0.0 --port 7860"
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=/bin/sh -c "until curl -sf http://127.0.0.1:7860/api/health/ready >/dev/null; do sleep 2; done; exec arq app.worker.WorkerSettings"
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:seed]
command=python seed.py
priority=40
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
