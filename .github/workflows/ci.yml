name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # Only for tests/test_semantic_pg.py (pgvector ranking + HNSW index); everything else uses SQLite.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: datalens
          POSTGRES_PASSWORD: datalens
          POSTGRES_DB: datalens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datalens -d datalens_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://datalens:datalens@localhost:5432/datalens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
